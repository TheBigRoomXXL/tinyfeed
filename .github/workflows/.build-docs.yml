name: build-docs

on:
  workflow_call:

permissions: {}

jobs:
  build-docs:
    runs-on: ubuntu-latest
    env:
      FEEDS: ${{vars.FEEDS}}
    steps:
      - name: setup-repos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: setup-go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b
        with:
          go-version-file: go.mod

      - name: setup-python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065

      - name: setup mkdocs
        run: pip install mkdocs

      - name: build-docs
        run: mkdocs build

      - name: copy-release-feed
        run: wget https://github.com/TheBigRoomXXL/tinyfeed/releases.atom -O site/releases.atom

      - name: build-demos
        run: |
          mkdir site/demo/
          echo '$FEEDS' | go run . -o site/demo/index.html -S /scripts/back-to-docs.js
          echo '$FEEDS' | go run . -o site/demo/solarized.html -S /scripts/back-to-docs.js -s /styles/solarized.css
          echo '$FEEDS' | go run . -o site/demo/lobster.html -S /scripts/back-to-docs.js -s /styles/lobster.css
          echo '$FEEDS' | go run . -o site/demo/hackernews.html -S /scripts/back-to-docs.js -s /styles/hackernews.css
          echo '$FEEDS' | go run . -o site/demo/back-to-top.html -S /scripts/back-to-docs.js -S /scripts/top.js

      - name: upload-artifact
        id: deployment
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site/
