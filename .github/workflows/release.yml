name: test-build-and-release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build-and-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: setup-repos
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: setup-go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b

      - name: cross-platform-build
        run: |
          mkdir ./builds/
          GOOS=linux   GOARCH=arm64 go build -ldflags="-s -w" -o ./builds/tinyfeed_linux_arm64
          GOOS=freebsd GOARCH=arm64 go build -ldflags="-s -w" -o ./builds/tinyfeed_freebsd_arm64
          GOOS=darwin  GOARCH=arm64 go build -ldflags="-s -w" -o ./builds/tinyfeed_darwin_arm64
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o ./builds/tinyfeed_windows_arm64
          GOOS=linux   GOARCH=amd64 go build -ldflags="-s -w" -o ./builds/tinyfeed_linux_amd64
          GOOS=freebsd GOARCH=amd64 go build -ldflags="-s -w" -o ./builds/tinyfeed_freebsd_amd64
          GOOS=darwin  GOARCH=amd64 go build -ldflags="-s -w" -o ./builds/tinyfeed_darwin_amd64
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o ./builds/tinyfeed_windows_amd64

          sudo apt install upx
          upx ./builds/tinyfeed_linux*
          upx ./builds/tinyfeed_windows*

      - name: release
        uses: ncipollo/release-action@440c8c1cb0ed28b9f43e4d1d670870f059653174
        with:
          artifacts: "./builds/*"
