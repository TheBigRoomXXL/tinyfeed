<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Feed</title>

	<meta http-equiv="Content-Security-Policy" content="
		default-src 'none';
		base-uri 'self';
		img-src 'self' data: ;
		style-src 'nonce-very-stable-nounce' ;
		script-src 'nonce-very-stable-nounce' 'strict-dynamic' ;
    ">
	<meta name="application-name" content="tinyfeed">
	<meta name="application-source" content="https://github.com/TheBigRoomXXL/tinyfeed">
	<meta name="author" content="Sebastien LOVERGNE">
	<meta name="description" content="RSS, Atom and JSON feeds aggregator">
	<meta name="referrer" content="same-origin">

	<style nonce="very-stable-nounce">
		:root {
			color-scheme: dark light;

			--primary: #0AC8F5;
			--secondary: #D2F00F;
			 
			--text: var(--txt, #cfcfcf);
			--border: var(--bd, #c0c0c0);
			--background: var(--bg, #1D1F21);
			font-size: min(calc(.5rem + 0.75vw), 16px);
		}

		@media (prefers-color-scheme: light) {
			:root {
				--text: var(--txt, #444444);
				--border: var(--bd, #333333);
				--background: var(--bg, white);
				--primary: #207D92;
				--secondary: #6A7A06;
			}
		}

		body {
			font-family: Calibri, 'Trebuchet MS', 'Lucida Sans', Arial, sans-serif;
			color: var(--text);
			background: var(--background);
			max-width: 50rem;
			width: 100%;
			margin: 0.5em auto 2em;
			line-height: 1.25em;
		}

		header {
			border-bottom: 1px solid var(--border);
			margin-bottom: 0.25em;
		}

		header>h1 {
			display: inline-block;
			padding: 0 0.5em;
		}

		h2 {
			font-size: 1rem;
			display: inline;
		}

		ol {
			padding-left: 5ch;
		}

		li {
			margin-block-start: 1em;
		}

		a {
			text-decoration: none;
		}

		a:link {
			color: var(--primary)
		}

		a:visited {
			color: var(--secondary)
		}

		a:hover {
			opacity: 0.8
		}

		small {
			padding-top: 0.25rem;
			font-size: 0.95rem;
		}

		small>a:link,
		small>a:visited {
			color: var(--text);
		}

		footer {
			padding: 1rem;
			margin-top: 2rem;
			border-top: 1px solid var(--border);
		}

		.feed-list {
			display: flex;
			flex-wrap: wrap;
			border: 0.5px solid var(--border);
		}

		.feed-list>div {
			flex-grow: 1;
			padding: 0.5em 0.5em 0.35em 0.5em;
			text-align: center;
			vertical-align: middle;
			border: 0.5px solid var(--border);
		}
	</style>

	

	
</head>

<body>
	<header>
		<h1>Feed</h1>
		
	</header>
	<main>
		<ol>
			
			<li>
				<a href=https://www.jsonfeed.org/2020/08/07/json-feed-version.html target="_blank">
					<h2>JSON Feed version 1.1</h2>
				</a>
				<br>
				<small>
					<time datetime="2020-08-07">2020-08-07</time>
					|
					<a href="https://jsonfeed.org" target="_blank">jsonfeed.org</a>
				</small>

			</li>
			
			<li>
				<a href=https://www.jsonfeed.org/2017/05/17/announcing-json-feed.html target="_blank">
					<h2>Announcing JSON Feed</h2>
				</a>
				<br>
				<small>
					<time datetime="2017-05-17">2017-05-17</time>
					|
					<a href="https://jsonfeed.org" target="_blank">jsonfeed.org</a>
				</small>

			</li>
			
		</ol>
	</main>
	<footer>
		<p>Last Updated On:
			<time id="update-at" datetime="2006-01-02T15:04:05Z">
				Monday, 2006-01-02 15:04:05
			</time>
		</p>
		<p>This page aggregate the following feeds:</p>
		<div class="feed-list">
			
			<div>
				<a href="https://www.jsonfeed.org/" target="_blank">JSON Feed</a>
			</div>
			
		</div>
	</footer>
</body>

<script type="module" nonce="very-stable-nounce">
	const updatedAtElement = document.getElementById("update-at");
	const date = new Date(updatedAtElement.dateTime);
	updatedAtElement.innerText = date.toLocaleString(undefined, {
		dateStyle: "full",
		timeStyle: "medium",
	})
</script>

</html>
